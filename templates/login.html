<!DOCTYPE html>
<html>
<head>

    <title>ShopEasy - Login</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #f4f6f8;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-box {

            width: 420px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.10);
        }

        h1 {

            text-align: center;

            margin-bottom: 8px;

            color: #111827;
        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-top: 16px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #111827;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {

            outline: none;

            border-color: #111827;
        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #111827;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #1f2937;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>ShopEasy</h1>

    <div class="subtitle">
        Enter your details to continue
    </div>

    <form action="/login"
          method="POST">

        <label>
            Full Name
        </label>

        <input
            type="text"
            name="full_name"
            placeholder="Enter your full name"
            required
        >

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>
            Age
        </label>

        <input
            type="number"
            name="age"
            placeholder="Enter your age"
            min="1"
            required
        >

        <label>
            Phone Number
        </label>

        <input
            type="tel"
            name="phone"
            placeholder="Enter your phone number"
            required
        >

        <button type="submit">
            Continue to ShopEasy
        </button>

    </form>

</div>

</body>
</html>
