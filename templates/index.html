<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
        }

        .cart-btn {
            background: white;
            color: #111827;
            font-weight: bold;
        }

        .logout-btn {
            background: #374151;
            color: white;
        }

        .hero {
            padding: 55px 6%;
            background: linear-gradient(
                135deg,
                #111827,
                #374151
            );
            color: white;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 17px;
            opacity: 0.9;
        }

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .section-title {
            font-size: 26px;
            margin-bottom: 22px;
        }

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(230px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-image {
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5e7eb;
            font-size: 65px;
        }

        .product-info {
            padding: 18px;
        }

        .product-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .category {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            background: #111827;
            color: white;
        }

        .add-btn:hover {
            background: #374151;
        }

        .cart-panel {
            position: fixed;
            right: -420px;
            top: 0;
            width: 400px;
            max-width: 95%;
            height: 100vh;
            background: white;
            z-index: 300;
            box-shadow: -5px 0 20px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            padding: 25px;
            overflow-y: auto;
        }

        .cart-panel.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .close-btn {
            background: #e5e7eb;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .cart-item-name {
            font-weight: bold;
        }

        .cart-item-price {
            color: #4b5563;
        }

        .remove-btn {
            background: #fee2e2;
            color: #991b1b;
            padding: 6px 9px;
        }

        .cart-total {
            font-size: 22px;
            font-weight: bold;
            margin: 25px 0;
        }

        .checkout-btn {
            width: 100%;
            background: #111827;
            color: white;
            font-size: 16px;
        }

        .empty-cart {
            color: #6b7280;
            text-align: center;
            padding: 40px 0;
        }

        .checkout-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 20px;
        }

        .checkout-modal.show {
            display: flex;
        }

        .checkout-box {
            background: white;
            width: 500px;
            max-width: 100%;
            border-radius: 14px;
            padding: 30px;
        }

        .checkout-box h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        .payment-btn {
            width: 100%;
            margin-top: 15px;
            background: #111827;
            color: white;
            font-size: 16px;
        }

        .cancel-btn {
            width: 100%;
            margin-top: 8px;
            background: #e5e7eb;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 25px;
        }

        .success-message.show {
            display: block;
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {

            .hero h1 {
                font-size: 32px;
            }

            .cart-panel {
                width: 100%;
            }

            header {
                padding: 15px 4%;
            }

            .logo {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        🛍️ ShopEasy
    </div>

    <div class="nav-actions">

        <button
            class="cart-btn"
            onclick="openCart()"
        >
            🛒 Cart
            <span id="cartCount">0</span>
        </button>

        <button
            class="logout-btn"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </div>

</header>


<section class="hero">

    <h1>Welcome to ShopEasy</h1>

    <p>
        Discover products, add them to your cart,
        and complete your purchase.
    </p>

</section>


<main class="container">

    <h2 class="section-title">
        Featured Products
    </h2>

    <div
        class="products"
        id="productsContainer"
    ></div>

</main>


<!-- =========================================================
     CART
========================================================= -->

<div
    class="cart-panel"
    id="cartPanel"
>

    <div class="cart-header">

        <h2>Your Cart</h2>

        <button
            class="close-btn"
            onclick="closeCart()"
        >
            ✕
        </button>

    </div>

    <div id="cartItems"></div>

    <div
        class="cart-total"
        id="cartTotal"
    >
        Total: ₹0
    </div>

    <button
        class="checkout-btn"
        onclick="openCheckout()"
    >
        Proceed to Checkout
    </button>

</div>


<!-- =========================================================
     CHECKOUT MODAL
========================================================= -->

<div
    class="checkout-modal"
    id="checkoutModal"
>

    <div class="checkout-box">

        <div id="checkoutForm">

            <h2>Checkout</h2>

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your name"
                >

            </div>

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="customerEmail"
                    placeholder="Enter your email"
                >

            </div>

            <div class="form-group">

                <label>
                    Delivery Address
                </label>

                <textarea
                    id="customerAddress"
                    rows="3"
                    placeholder="Enter delivery address"
                ></textarea>

            </div>

            <div class="form-group">

                <label>
                    Card Number
                </label>

                <input
                    type="text"
                    id="cardNumber"
                    placeholder="XXXX XXXX XXXX XXXX"
                    maxlength="19"
                >

            </div>

            <button
                class="payment-btn"
                onclick="completePurchase()"
            >
                Complete Purchase
            </button>

            <button
                class="cancel-btn"
                onclick="closeCheckout()"
            >
                Cancel
            </button>

        </div>


        <div
            class="success-message"
            id="successMessage"
        >

            <div class="success-icon">
                ✅
            </div>

            <h2>
                Purchase Successful!
            </h2>

            <p>
                Thank you for shopping with ShopEasy.
            </p>

            <br>

            <button
                class="payment-btn"
                onclick="finishPurchase()"
            >
                Continue Shopping
            </button>

        </div>

    </div>

</div>


<script src="/static/js/tracker.js"></script>

<script>

    // ========================================================
    // PRODUCTS
    // ========================================================

    const products = [

        {
            id: "P001",
            name: "Premium Headphones",
            category: "Electronics",
            price: 2499,
            icon: "🎧"
        },

        {
            id: "P002",
            name: "Smart Watch",
            category: "Electronics",
            price: 3999,
            icon: "⌚"
        },

        {
            id: "P003",
            name: "Running Shoes",
            category: "Fashion",
            price: 2999,
            icon: "👟"
        },

        {
            id: "P004",
            name: "Travel Backpack",
            category: "Accessories",
            price: 1799,
            icon: "🎒"
        },

        {
            id: "P005",
            name: "Wireless Speaker",
            category: "Electronics",
            price: 1999,
            icon: "🔊"
        },

        {
            id: "P006",
            name: "Classic Sunglasses",
            category: "Fashion",
            price: 1299,
            icon: "🕶️"
        },

        {
            id: "P007",
            name: "Casual T-Shirt",
            category: "Fashion",
            price: 799,
            icon: "👕"
        },

        {
            id: "P008",
            name: "Laptop Stand",
            category: "Accessories",
            price: 1499,
            icon: "💻"
        }

    ];


    let cart = [];


    // ========================================================
    // FORMAT MONEY
    // ========================================================

    function formatPrice(price) {

        return "₹" +
            price.toLocaleString("en-IN");

    }


    // ========================================================
    // LOAD PRODUCTS
    // ========================================================

    function loadProducts() {

        const container =
            document.getElementById(
                "productsContainer"
            );

        container.innerHTML = "";


        products.forEach(product => {

            const card =
                document.createElement("div");

            card.className =
                "product-card";


            card.innerHTML = `

                <div
                    class="product-image"
                    onclick="viewProduct('${product.id}')"
                >
                    ${product.icon}
                </div>

                <div class="product-info">

                    <div class="product-name">
                        ${product.name}
                    </div>

                    <div class="category">
                        ${product.category}
                    </div>

                    <div class="price">
                        ${formatPrice(product.price)}
                    </div>

                    <button
                        class="add-btn"
                        onclick="addToCart('${product.id}')"
                    >
                        Add to Cart
                    </button>

                </div>

            `;

            container.appendChild(card);

        });

    }


    // ========================================================
    // PRODUCT VIEW
    // ========================================================

    function viewProduct(productId) {

        const product =
            products.find(
                p => p.id === productId
            );

        if (!product) {
            return;
        }


        if (typeof trackEvent === "function") {

            trackEvent(
                "product_view",
                product.id
            );

        }

        alert(
            product.name +
            "\n\n" +
            product.category +
            "\n" +
            formatPrice(product.price)
        );

    }


    // ========================================================
    // ADD TO CART
    // ========================================================

    function addToCart(productId) {

        const product =
            products.find(
                p => p.id === productId
            );

        if (!product) {
            return;
        }


        const existing =
            cart.find(
                item => item.id === productId
            );


        if (existing) {

            existing.quantity += 1;

        } else {

            cart.push({

                id: product.id,

                name: product.name,

                price: product.price,

                quantity: 1

            });

        }


        if (typeof trackEvent === "function") {

            trackEvent(
                "add_to_cart",
                product.id
            );

        }


        updateCart();

        openCart();

    }


    // ========================================================
    // REMOVE FROM CART
    // ========================================================

    function removeFromCart(productId) {

        cart =
            cart.filter(
                item => item.id !== productId
            );

        updateCart();

    }


    // ========================================================
    // CART UPDATE
    // ========================================================

    function updateCart() {

        const cartItems =
            document.getElementById(
                "cartItems"
            );

        const cartCount =
            document.getElementById(
                "cartCount"
            );

        const cartTotal =
            document.getElementById(
                "cartTotal"
            );


        let count = 0;

        let total = 0;


        cart.forEach(item => {

            count += item.quantity;

            total +=
                item.price *
                item.quantity;

        });


        cartCount.textContent =
            count;


        cartTotal.textContent =
            "Total: " +
            formatPrice(total);


        if (cart.length === 0) {

            cartItems.innerHTML = `

                <div class="empty-cart">

                    Your cart is empty.

                </div>

            `;

            return;

        }


        cartItems.innerHTML = "";


        cart.forEach(item => {

            const row =
                document.createElement("div");

            row.className =
                "cart-item";


            row.innerHTML = `

                <div>

                    <div class="cart-item-name">
                        ${item.name}
                    </div>

                    <div class="cart-item-price">
                        ${formatPrice(item.price)}
                        ×
                        ${item.quantity}
                    </div>

                </div>

                <button
                    class="remove-btn"
                    onclick="removeFromCart('${item.id}')"
                >
                    Remove
                </button>

            `;


            cartItems.appendChild(row);

        });

    }


    // ========================================================
    // OPEN CART
    // ========================================================

    function openCart() {

        document
            .getElementById("cartPanel")
            .classList.add("open");


        if (
            typeof trackEvent === "function" &&
            cart.length > 0
        ) {

            trackEvent(
                "view_cart"
            );

        }

    }


    // ========================================================
    // CLOSE CART
    // ========================================================

    function closeCart() {

        document
            .getElementById("cartPanel")
            .classList.remove("open");

    }


    // ========================================================
    // OPEN CHECKOUT
    // ========================================================

    function openCheckout() {

        if (cart.length === 0) {

            alert(
                "Please add a product to your cart first."
            );

            return;

        }


        if (typeof trackEvent === "function") {

            trackEvent(
                "checkout"
            );

        }


        document
            .getElementById("checkoutModal")
            .classList.add("show");

    }


    // ========================================================
    // CLOSE CHECKOUT
    // ========================================================

    function closeCheckout() {

        document
            .getElementById("checkoutModal")
            .classList.remove("show");

    }


    // ========================================================
    // COMPLETE PURCHASE
    // ========================================================

    function completePurchase() {

        const name =
            document
                .getElementById(
                    "customerName"
                )
                .value.trim();


        const email =
            document
                .getElementById(
                    "customerEmail"
                )
                .value.trim();


        const address =
            document
                .getElementById(
                    "customerAddress"
                )
                .value.trim();


        const card =
            document
                .getElementById(
                    "cardNumber"
                )
                .value.trim();


        if (
            !name ||
            !email ||
            !address ||
            !card
        ) {

            alert(
                "Please fill all checkout details."
            );

            return;

        }


        // ----------------------------------------------------
        // SEND PURCHASE EVENT
        // ----------------------------------------------------

        if (typeof trackEvent === "function") {

            if (cart.length > 0) {

                cart.forEach(item => {

                    trackEvent(
                        "purchase",
                        item.id
                    );

                });

            } else {

                trackEvent(
                    "purchase"
                );

            }

        }


        document
            .getElementById(
                "checkoutForm"
            )
            .style.display = "none";


        document
            .getElementById(
                "successMessage"
            )
            .classList.add("show");

    }


    // ========================================================
    // FINISH PURCHASE
    // ========================================================

    function finishPurchase() {

        cart = [];


        updateCart();

        closeCheckout();

        closeCart();


        document
            .getElementById(
                "checkoutForm"
            )
            .style.display = "block";


        document
            .getElementById(
                "successMessage"
            )
            .classList.remove("show");


        document
            .getElementById(
                "customerName"
            )
            .value = "";


        document
            .getElementById(
                "customerEmail"
            )
            .value = "";


        document
            .getElementById(
                "customerAddress"
            )
            .value = "";


        document
            .getElementById(
                "cardNumber"
            )
            .value = "";

    }


    // ========================================================
    // LOGOUT
    // ========================================================

    function logoutUser() {

        window.location.href =
            "/logout";

    }


    // ========================================================
    // INITIALIZE
    // ========================================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadProducts();

            updateCart();

        }
    );

</script>

</body>
</html>
